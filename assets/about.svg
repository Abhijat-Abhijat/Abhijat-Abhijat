<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d"><title id="t">About Abhijat</title><desc id="d">I work at the intersection of AI and software engineering. Today that means production AI agent systems at Tata Consultancy Services, embedded with UBS. I care about the engineering around the model, because an AI system is only as good as what holds it up. Away from work I build an operating system, developer tools and a job platform that ranks by fit. I also wrote a beginner’s book on AI and IoT. 15+ AI agent workflows built; 13+ teams using the identification agent; 40% faster deployments via CI/CD; 15% reported drop in downtime; 50+ production issues resolved; 22% stability gain on a 10K+ user product. Figures are self-reported from my work history.</desc><style>@font-face{font-family:"AJ Sans";font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"AJ Serif";font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"AJ Mono";font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}.sans{font-family:"AJ Sans",Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;font-weight:400;font-style:normal}.serif{font-family:"AJ Serif","Instrument Serif", Georgia, "Times New Roman", serif;font-weight:400;font-style:normal}.mono{font-family:"AJ Mono","Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;font-weight:400;font-style:normal}</style><rect x=".5" y=".5" width="799" height="399" rx="12" fill="#0D0F10" stroke="#343638"/>
